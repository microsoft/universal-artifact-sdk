name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the newest stable release.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python package
        run: python -m pip install ".[dev]"

      - name: Type-check
        run: python -m mypy

      - name: Lint
        run: python -m ruff check python parity

      - name: Test
        run: python -m pytest python/tests

      - name: Build Python distributions
        run: python -m build --outdir dist-python

      - name: Inspect Python distributions
        run: python -m twine check --strict dist-python/*

      - name: Install and import the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install --no-cache-dir dist-python/*.whl
          /tmp/wheel-check/bin/python -c "import universal_artifact_sdk as sdk; \
            print(sdk.SDK_VERSION, len(sdk.__all__)); \
            assert sdk.canonical_schema_path().is_file()"

  parity:
    needs: [build-and-test, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install ".[dev]"

      # Builds the frozen TypeScript binding, runs both binding runners over the shared
      # corpus, then cross-opens each binding's output with the other.
      - name: Cross-binding conformance
        run: npm run test:parity
