name: Publish SDK bindings

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify tag matches both package versions
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          PY_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ] || [ "${PKG_VERSION#v}" != "$PY_VERSION" ]; then
            echo "::error::Release tag ($TAG) must match package.json ($PKG_VERSION) and pyproject.toml ($PY_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install ".[dev]"

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify Python binding
        run: |
          python -m mypy
          python -m ruff check python parity
          python -m pytest python/tests

      # Runs both binding runners over the shared corpus and cross-opens each
      # binding's output with the other.
      - name: Cross-binding conformance
        run: npm run test:parity

      # `python -m build` builds the sdist, then builds the wheel *from* that sdist in
      # an isolated environment, so an incomplete sdist fails here rather than on PyPI.
      - name: Build and inspect Python distributions
        run: |
          python -m build --outdir dist-python
          python -m twine check --strict dist-python/*

      - name: Install and import the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install --no-cache-dir dist-python/*.whl
          /tmp/wheel-check/bin/python -c "import universal_artifact_sdk as sdk; \
            assert sdk.canonical_schema_path().is_file()"

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python/
