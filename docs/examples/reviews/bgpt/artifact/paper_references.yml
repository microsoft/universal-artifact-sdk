    ABC Notation ABC notation is a shorthand form of music notation that uses ASCII
    characters to represent musical notes and symbols. It is a compact, human-readable,
    and easily typed format that has gained popularity for its ability to facilitate
    the swift digital transcription, sharing, and editing of music. Originating within
    folk and traditional music circles, ABC notation has become a universal method
    for musicians and enthusiasts to exchange music without the need for proprietary
    software or extensive musical training. To illustrate the fundamentals of ABC
    notation, consider the example below, which depicts a folk tune: X:1 L:1/8 M:3/4
    K:D de |"D" f3 g a{/g}f |"A" e4 AB |"C" =c3 d"G/B" B{/A}G |"A" A4 fg | "D" a3
    g fd |"A" e4 AB |"C" =c3 d e{/f}g |"D" f4 :: d{/edc}A |"Bm" B2 A2 F2 |"F#m" A3
    B d{/edc}A |"G" B2 A2 F2 | "A" (E4 E)A |"Bm" B3 A FD |"F#m" C3 D (F/G/A) |"G"
    B3 e"A" dc |"D" d4 :| The corresponding sheet music rendered from this ABC sequence
    is shown in Fig. 4. In this example, the structure of ABC notation starts with
    a header that includes: • X (Tune Number): This is a unique number assigned to
    the tune, serving as a reference in collections or databases. • L (Unit Note Length):
    This defines the default duration of notes. In this context, 1/8 indicates that
    each note is an eighth note, which is a standard choice for folk tunes. • M (Meter):
    This denotes the time signature of the piece, which determines the rhythmic pulse.
    Here, 3/4 suggests a waltz-like rhythm. • K (Key): This sets the key signature
    for the tune. D signifies that the piece is in the key of D major. After the header,
    the body of the ABC notation consists of the musical notes themselves. Each note
    is represented by a letter (A to G), which corresponds to the pitch. The octaves
    are indicated by lower-cased letters or apostrophes for higher octaves and upper-cased
    letters or commas for lower or higher octaves, respectively. The duration of notes
    is modified by numbers; for instance, a 2 following a note would double its value,
    while a /2 would halve it. Chords can be notated by enclosing the Beyond Language
