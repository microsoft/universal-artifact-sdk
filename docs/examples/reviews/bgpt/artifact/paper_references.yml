    of musical scores and the modern digital world, offering a text-based alternative
    that is both efficient and widely accessible. For a detailed documentation of
    ABC notation, please refer to the ABC notation standard2. A.2. MIDI MIDI, short
    for Musical Instrument Digital Interface, is a technical standard that describes
    a protocol, digital interface, and connectors and allows a wide variety of electronic
    musical instruments, computers, and other related devices to connect and communicate
    with one another. Unlike ABC notation, which is designed for human readability
    and the transcription of musical scores, MIDI is focused on capturing and conveying
    information about music performance and production in a format that machines can
    interpret and process. The core of MIDI communication involves MIDI messages,
    which are digital signals that represent various musical elements such as notes,
    pitch, velocity (how hard a note is played), control changes (modifications to
    sound parameters), and program changes (instrument changes). These messages do
    not transmit audio; instead, they send instructions about how music should be
    played or produced. This approach allows MIDI to be incredibly versatile and lightweight
    compared to raw audio, suitable for real-time control during live performances
    and detailed editing in studio environments. MIDI files, commonly with the extension
    .mid or .midi, store sequences of MIDI messages that can be played back by computer
    software or electronic instruments. These files make it possible to share and
    distribute musical compositions in a form that can be easily modified, transposed,
    or played back with different instrument sounds, offering a level of flexibility
    and creative freedom that is unique to the digital music domain. 2https://abcnotation.com/wiki/abc:standard:v2.1
    Beyond Language Models: Byte Models are Digital World Simulators There are several
    ways to create and edit MIDI, each catering to different workflows and preferences:
    • MIDI Keyboards and Controllers : Physical devices that allow musicians to input
    notes and control data into a computer. They emulate traditional instruments and
    can capture the nuances of a performance in MIDI format. • Piano Roll: A graphical
    interface in digital audio workstations (as shown in Fig. 1) where notes are displayed
    and edited on a grid representing pitch and time. It is intuitive for composing
    melodies, chords, and rhythms. • Score Editor: Allows users to input and edit
    music in traditional notation, converting written notes into MIDI data. Ideal
    for those familiar with musical notation. • Programming and Scripting: Involves
    writing code to generate and manipulate MIDI data, offering complex and generative
    musical possibilities beyond manual input methods. For instance, complex MIDI
    sequences and automation can be generated using software such as Max/MSP, Pure
    Data, or programming languages (e.g., SuperCollider). Although MIDI offers immense
    benefits for musicians and producers, when converting MIDI data back into score-oriented
    symbolic music formats like ABC notation, certain challenges arise due to the
    intrinsic differences between these formats. MIDI excels at capturing how a piece
    of music is played, including the timing, velocity, and expressiveness of each
    note. In contrast, ABC notation focuses on the structural elements of music, such
    as melody, harmony, and rhythm, using a textual format that is more accessible
    for human reading and writing but less detailed in terms of performance nuances.
    To illustrate the conversion between MIDI and ABC notation, consider the following
    example: X:1 L:1/8 M:3/4 K:D de f3 g | ag/<f/ e4 | AB =c3 d | BA/<G/ A4 | fg a3
    g | fd e4 | AB =c3 d | ef/<g/ f4 | de f3 g | ag/<f/ e4 | AB =c3 d | BA/<G/ A4
    | fg a3 g | fd e4 | AB =c3 d | ef/<g/ f4 | de/4d/4c/4A/4 B2 A2 | F2 A3 B | de/4d/4c/4A/4
    B2 A2 | F2 E4 | EA B3 A | FD C3 D | F/G/A B3 e | dc d4 | de/4d/4c/4A/4 B2 A2 |
    F2 A3 B | de/4d/4c/4A/4 B2 A2 | F2 E4 | EA B3 A | FD C3 D | F/G/A B3 e | dc d4
    |] This is the same tune we have demonstrated in Fig, 4, but it has now been converted
    from ABC notation to MIDI and subsequently back to ABC notation. The corresponding
    sheet music, rendered from this ABC sequence, is shown in Fig. 5. One can observe
    that the ABC sequence and the musical score appear significantly longer than the
    original due to the elimination of repeat signs in MIDI, requiring repeated sections
    to be explicitly written out. Additionally, the bar divisions and the ornaments
    in the MIDI-to-ABC conversion might not align perfectly with the original ABC
    notation. These ornaments are often represented as a series of rapid notes in
    MIDI, which can complicate their translation back into ABC notation. While MIDI-rendered
    sheet music and its ABC notation counterpart may sound identical when performed,
    the visual complexity of the MIDI transcription can make it more challenging to
    read than the ABC version. This discrepancy underscores the fact that MIDI and
    ABC are formats tailored for different contexts. MIDI is adept at capturing nuanced
    performance data, such as dynamics and subtle timing variations, which are essential
    for playback fidelity but are not as visually straightforward as ABC notation.
    On the other hand, ABC notation, with its simplified symbolic representation,
    is not ideal for conveying detailed performance information. Both formats have
    overlapping capabilities in representing musical information, yet each also possesses
    unique characteristics that do not translate perfectly when converting from one
    to the other. This results in a loss of information: nuances specific to each
    format can be diminished or omitted entirely during the conversion process. Such
    losses present a challenge in preserving the full intent and detail of a musical
    piece when moving between ABC and MIDI formats. B. CPU States Dataset The CPU
    States Dataset has been crafted using a Python script to simulate the operations
    of a CPU, offering a controlled environment to assess the capabilities of bGPT
    in modelling the hardware behaviour. This appendix offers an overview of the dataset,
    introducing the structure, instruction set, and details of the dataset curation.
    Beyond Language Models: Byte Models are Digital World Simulators The dataset comprises
    entries of 1KB memory blocks, each paired with a subsequent 16-byte sequence representing
    the CPU register states. The memory blocks encode varying numbers of machine instructions,
    while the register state sequence includes the CPU status post-execution of each
    instruction. The CPU registers in each state consist of: • Program Counter (PC):
    1 byte in size, points to the next instruction in the memory. • Accumulator (ACC):
    A 1-byte register involved in arithmetic and logic operations. • Instruction Register
    (IR): Occupies 4 bytes, storing the currently executed instruction. • General-Purpose
    Registers: An additional 10 bytes are allocated, emulating a range of registers
    (labelled A-J) used for various computational purposes. Transitions between states
    mimic the execution cycle of a CPU, including fetching instructions from memory,
    decoding them to determine the required operation, and executing the operation
    to modify the state. The execution process includes instructions for modifying
    register values, performing arithmetic calculations, and controlling the program
    flow. Each instruction in the dataset is encoded in a four-byte format OP ADDR1
    ADDR2 ADDR3 , with each byte serving a specific purpose: • OP (Operation Code):
    1 byte representing the opcode of the instruction to be executed. • ADDR1, ADDR2,
    ADDR3: 1 byte each, representing up to three addresses that the instruction may
    interact with. The opcode and addresses together describe the action to be taken
    by the CPU. The instructions vary in terms of the number of addresses they use,
    from zero-address to three-address instructions. This variability allows the simulation
    of a wide range of operations, from simple data movement to complex arithmetic
    and logical functions. Table 7 (located on page 19) details the instruction set
    and the variants each instruction can have, depending on the values in the address
    fields. The variant to be executed is determined by the non-zero value in the
    address fields. For zero-address instructions, all address fields are zero. For
    single-address instructions, ADDR1 holds the address of the register involved,
    and the other fields are zero. For two- and three-address instructions, the respective
    fields hold the addresses of the registers involved in the operation. In designing
    the instruction set, complex instructions like jump commands were deliberately
    excluded to prevent the occurrence of infinite loops or other complexities that
    could hinder straightforward simulation. The Python script generates the CPU States
    Dataset by randomly initializing the ACC and general-purpose registers for each
    simulation, thereby ensuring a wide range of starting conditions. It then executes
    a random sequence of instructions, varying in length from 1 to 256, with the effect
    of each instruction on the CPU state being recorded. This results in a sequence
    of states that reflects the cumulative impact of the executed instructions. The
    script guarantees that each sequence culminates with a halt instruction HLT, marking
    the end of a program. Furthermore, when considering only the register changes
    related to instructions, there are over 516 million potential scenarios resulting
    from combinations of various instruction types, registers, and their values. The
    dataset thus produced comprises 2.1 million entries for the training set and 21,000
    entries for the evaluation set. This process, with its random initial states and
    varied instruction lengths, produces a diverse dataset that is essential for training
    and evaluating the effectiveness of bGPT in modelling CPU states. To aid in a
    more intuitive comprehension of the operational logic of the CPU, a randomly generated
    program for executing 10 instructions along with their corresponding states in
    human-readable form is provided below: Program: [’MUL J A’, ’DIV I’, ’MUL E D’,
