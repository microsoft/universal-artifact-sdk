    importance estimation of SSD resulting in the LFSSD method. across repeated runs.
    We use the same membership inference attack as in Chundawat et al. (2023a); Foster
    et al. (2023), where logistic regression is used to classify samples as seen or
    unseen for a given model, based the entropy of the model outputs for that sample.
    Resources. A single backward pass over the full dataset D is O(bf ull· p) where
    bf ullis the number of batches in the dataset and p is the number of parameters
    in the model. Similarly, the complexity for the forget and retain set is O(bf
    orget· p) and O(bretain · p), respectively. Note that bretain ≈ bf ull>> bf orget.
    SSD requires only one computation of the gradients for D (can be saved and reused),
    then for every forget request it requires one computation forDf to then apply
    the dampening in O(bf orget· p). LFSSD has the same complexity as SSD with the
    difference being that LFSSD calculates the norm of the output instead of the loss.
    In practice, this is similar in compute time. Other methods are retraining-based
    and depend on the number of epochs N, generally on the order of O(N · bretain
    · p), which is much larger. Sensitivity analysis. The values for alpha and lambda
    for SSD are taken from Foster et al. (2023) where the authors used Optuna to search
    for ideal parameters. For LFSSD we performed a simplified hyperparameter search
    keeping lambda fixed at 1 and alpha values [1, 50]. We pick one value per unlearning
    task (e.g. full class, sub-class, random) to show robustness across classes and
    do not use the best alpha per individual class/subclass (e.g., taking alpha 25
    for rocket, alpha 5 for another class, etc.). A sensitivity analysis in Table
    2 on CIFAR100 rocket class unlearning shows that there is a significant drop off
    in performance when picking an alpha that is too aggressive or conservative but
    the method has a wide plateau in which it performs well. Unlearning scenarios
    without labels. For cases where labels are hard to get we expect two main scenarios:
    First, having a catalogue of undesired/copyrighted data (e.g., images) that we
    want to unlearn from the model just to be on the safe side legally even if it
    might not be in the model. In this case, we do not have the labels. Second, models
    that were trained with semi-supervised learning could benefit from our method
    when we do not want to rely on the accuracy of pseudo labels. Accepted as a Tiny
