    on Neural Networks and Learning Systems, 2023. A A PPENDIX Benchmarks. We evaluate
    LFSSD in the same manner as Chundawat et al. (2023a); Foster et al. (2023), comparing
    against a baseline model without any unlearning, a model retrained from scratch
    on only Dr, a model finetuned for 2 epochs on Dr, and several existing state-of-the-art
    methods (Chundawat et al., 2023a; Graves et al., 2021; Foster et al., 2023) (teacher,
    amnesiac, SSD). Three key tasks are evaluated using ResNet18 (RN) and Vision Transformer
    (ViT): full class, subclass, and random forgetting. Fullclass entails forgetting
    an entire class from the dataset (e.g. rocket from Cifar100), subclass involves
    forgetting a related subclass from the dataset (e.g. all rockets from class Vehicle2
    in Cifar20), and random forgetting selects a random subset of samples across all
    classes. Datasets used include the Cifar suite (Krizhevsky & Hinton, 2010), and
    the PINS face recognition dataset (Burak, 2020). Runs are repeated 10 times for
    each method, with the mean and standard deviation shown in the tables. Dr and
    Df in the tables denote the accuracy on the respective subset of data in percent.
    Since SSD (and therefore LFSSD) is deterministic, there is no standard deviation
